services:
  # Stalkify Web Service
  - type: web
    name: stalkify-web
    runtime: python3
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: stalkify-db
          property: connectionString

  # PostgreSQL Database
  - type: pserv
    name: stalkify-db
    ipAllowList: []  # Only accessible by other services

